spring.application.name=spring_test
server.servlet.context-path=/spring_test
server.port=7777
spring.thymeleaf.cache=false

# MySQLの接続設定
spring.datasource.url=jdbc:mysql://localhost:8889/spring_test?useSSL=false&serverTimezone=Asia/Tokyo
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPAの設定
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

upload.path=C:/workspace/spring_test/src/main/resources/static/images/