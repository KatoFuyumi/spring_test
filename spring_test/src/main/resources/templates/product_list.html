<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	
<head>
<meta charset="UTF-8">
<title>商品一覧</title>
<link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>
	<header th:replace="~{common/header :: header}"></header>
		
	<h1>商品一覧画面</h1>
	
	<div class="product-list">	
		<div class="product-card" th:each="product : ${products}">
			
			<a th:href="@{/product/detail/{id}(id=${product.productId})}">
				<img th:src="@{/images/{file}(file=${product.imgPath})}" width="150">
				
				<p>商品名　<span th:text="${product.productName}"></span></p>
				<p>メーカー名　<span  th:text="${product.company.companyName}"></span></p>
				<p>￥<span  th:text="${product.price}"></span></p>
				<p>￥<span  th:text="${product.taxPrice}"></span>（税込）</p>
			</a>
			
		</div>
	</div>
		
	<footer th:replace="~{common/footer :: footer}"></footer>
</body>
</html>
